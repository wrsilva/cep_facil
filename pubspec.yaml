name: cep_facil
description: "Aplicativo de consulta de CEP via ViaCEP."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  dio: ^5.8.0
  sqflite: ^2.4.2
  path: ^1.9.1
  go_router: ^15.1.2
  talker_flutter: ^4.5.3
  talker_dio_logger: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter_native_splash:
  color: "#1565C0"
  color_dark: "#0D47A1"
  image: assets/images/app_icon.png
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
